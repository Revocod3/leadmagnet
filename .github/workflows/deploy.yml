name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deployment-secrets  # Especifica el environment
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: 📥 Install dependencies
      run: pnpm install

    - name: 🧪 Run tests (opcional)
      run: |
        echo "Tests would run here"
        # pnpm test

    - name: 🏗️ Build frontend
      run: pnpm --filter @ovp/frontend build

    - name: 📤 Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e  # Detener si hay error
          cd /var/www/leadmagnet
          
          echo "📥 Pulling latest changes..."
          git pull origin main
          
          echo "📦 Installing dependencies..."
          pnpm install
          
          echo "🔧 Updating backend .env if needed..."
          # Asegurar configuración correcta de producción
          sed -i 's/^PORT=.*/PORT=3003/' apps/backend/.env
          sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=http://139.59.152.82:5173|' apps/backend/.env
          sed -i 's/^OPENAI_ASSISTANT_ID=$/OPENAI_ASSISTANT_ID=asst_pmSpGqn4zfnk1tEXICepkALE/' apps/backend/.env
          
          echo "🔧 Updating frontend .env if needed..."
          sed -i 's|^VITE_API_URL=.*|VITE_API_URL=http://139.59.152.82:3003|' apps/frontend/.env
          
          echo "🏗️ Building frontend..."
          cd apps/frontend && pnpm build && cd ../..
          
          echo "🔄 Restarting services..."
          # Solo reiniciar nuestras apps, no todas
          cd apps/backend
          pm2 restart leadmagnet-backend || pm2 start "pnpm dev" --name leadmagnet-backend
          cd ../frontend
          pm2 restart leadmagnet-frontend || pm2 start "pnpm dev --host" --name leadmagnet-frontend
          cd ../..
          
          echo "💾 Saving PM2 configuration..."
          pm2 save
          
          echo "📊 Services status:"
          pm2 list | grep leadmagnet

    - name: ✅ Deployment complete
      run: |
        echo "🎉 Deployed successfully to production!"
        echo "Frontend: http://${{ secrets.SERVER_HOST }}:5173"
        echo "Backend: http://${{ secrets.SERVER_HOST }}:3003"
