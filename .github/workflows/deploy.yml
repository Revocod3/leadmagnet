name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deployment-secrets  # Especifica el environment
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: 📥 Install dependencies
      run: pnpm install

    - name: 🧪 Run tests (opcional)
      run: |
        echo "Tests would run here"
        # pnpm test

    - name: 🔍 Type check frontend
      run: pnpm --filter @ovp/frontend exec tsc --noEmit

    - name: 📤 Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e  # Detener si hay error
          cd /var/www/leadmagnet
          
          echo "📥 Pulling latest changes..."
          git pull origin main
          
          echo "📦 Installing dependencies..."
          pnpm install
          
          echo "🔧 Updating backend .env if needed..."
          # Asegurar configuración correcta de producción
          sed -i 's/^PORT=.*/PORT=3003/' apps/backend/.env
          sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=https://chat.objetivovientreplano.com|' apps/backend/.env
          sed -i 's|^API_URL=.*|API_URL=https://chat.objetivovientreplano.com|' apps/backend/.env
          sed -i 's/^OPENAI_ASSISTANT_ID=$/OPENAI_ASSISTANT_ID=asst_pmSpGqn4zfnk1tEXICepkALE/' apps/backend/.env

          echo "🔧 Updating frontend .env if needed..."
          sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://chat.objetivovientreplano.com|' apps/frontend/.env
          
          echo "🏗️ Building frontend..."
          cd apps/frontend && pnpm build && cd ../..
          
          echo "🔄 Restarting backend..."
          pm2 restart leadmagnet-backend

          echo "📊 Services status:"
          pm2 list | grep leadmagnet

    - name: ✅ Deployment complete
      run: |
        echo "🎉 Deployed successfully to production!"
        echo "Frontend: https://chat.objetivovientreplano.com"
        echo "Backend API: https://chat.objetivovientreplano.com/api/health"
